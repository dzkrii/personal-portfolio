name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-personal-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "76.13.18.150"
          port: "1204"
          username: "kyura"
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/kyura/projects/personal/personal-portfolio
            git remote set-url origin https://github.com/dzkrii/personal-portfolio.git 2>/dev/null || true
            bash /home/kyura/projects/personal/personal-portfolio/scripts/deploy.sh

